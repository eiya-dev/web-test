<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#101820">
  <title>密室からの脱出</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell" aria-label="密室からの脱出ゲーム">
    <header class="game-header">
      <div>
        <p class="eyebrow">THE LOCKED ROOM</p>
        <h1>密室からの脱出</h1>
      </div>
      <button class="reset-button" id="reset-button" type="button" aria-label="ゲームを最初からやり直す">↻ <span>最初から</span></button>
    </header>

    <section class="room-card" aria-label="調査する部屋">
      <div class="room-scene" id="room-scene">
        <div class="ceiling-light"></div>
        <div class="window"><span></span><i></i><b></b></div>
        <div class="moon-glow"></div>
        <button class="hotspot clock-hotspot" data-object="clock" type="button" aria-label="壁時計を調べる">
          <span class="clock-face"><i></i><b></b><em>12</em><small>6</small></span>
          <span class="object-label">壁時計</span>
        </button>
        <button class="hotspot shelf-hotspot" data-object="shelf" type="button" aria-label="本棚を調べる">
          <span class="shelf-frame"><i></i><b></b><em></em><small></small></span>
          <span class="object-label">本棚</span>
        </button>
        <button class="hotspot desk-hotspot" data-object="desk" type="button" aria-label="机を調べる">
          <span class="desk-lamp"></span><span class="desk-top"></span><span class="desk-body"></span>
          <span class="object-label">机</span>
        </button>
        <button class="hotspot drawer-hotspot" data-object="drawer" type="button" aria-label="引き出しを調べる">
          <span class="drawer-body"><i></i><b></b><em></em></span>
          <span class="object-label">引き出し</span>
        </button>
        <button class="hotspot door-hotspot" data-object="door" type="button" aria-label="扉を調べる">
          <span class="door-shape"><i></i><b></b><em>?</em></span>
          <span class="object-label">出口</span>
        </button>
        <div class="floor-shadow"></div>
      </div>

      <div class="message-panel" aria-live="polite">
        <span class="message-icon" id="message-icon">◌</span>
        <p id="message-text">目を覚ますと、見知らぬ部屋にいた。出口には4桁の鍵がかかっている。</p>
      </div>
    </section>

    <section class="inventory-section" aria-label="集めたヒント">
      <div class="section-heading"><h2>手がかり</h2><span id="clue-count">0 / 3</span></div>
      <div class="inventory" id="inventory">
        <div class="inventory-slot empty"><span>?</span><small>未調査</small></div>
        <div class="inventory-slot empty"><span>?</span><small>未調査</small></div>
        <div class="inventory-slot empty"><span>?</span><small>未調査</small></div>
      </div>
    </section>

    <section class="code-panel is-locked" id="code-panel" aria-label="出口の暗証番号">
      <div class="lock-status"><span class="lock-dot"></span><span id="lock-label">手がかりを3つ集めると入力できます</span></div>
      <form class="code-form" id="code-form">
        <label for="code-input">暗証番号</label>
        <div class="code-row">
          <input id="code-input" type="tel" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="----" autocomplete="off" aria-label="4桁の暗証番号" disabled>
          <button type="submit" id="unlock-button" disabled>解錠</button>
        </div>
        <p class="code-feedback" id="code-feedback"></p>
      </form>
    </section>
    <p class="footer-note">部屋の中を調べて、静かに手がかりを集めよう。</p>
  </main>
  <div class="success-overlay" id="success-overlay" aria-hidden="true">
    <div class="success-card">
      <div class="success-symbol">✦</div>
      <p class="eyebrow">ESCAPE COMPLETE</p>
      <h2>脱出成功</h2>
      <p>扉の向こうから、朝の光が差し込んだ。<br>あなたは密室を抜け出した。</p>
      <button id="play-again-button" type="button">もう一度遊ぶ</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
